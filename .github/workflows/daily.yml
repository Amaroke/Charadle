name: Daily

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl --silent --show-error --fail-with-body --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily"
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
